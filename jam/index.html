<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tide Garden</title>
<style>
  :root{
    --bg:#0B1626; --bg-low:#050A14; --bg-high:#12253D;
    --bloom:#FF8A6B; --drift:#3FBFB0; --pulse:#E8C97A; --text:#C9D6E8;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font:14px/1.4 system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;}
  #water{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #start-veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:rgba(5,10,20,.85);z-index:50;cursor:pointer;}
  #start-veil h1{font-weight:300;letter-spacing:.3em;text-transform:uppercase;font-size:20px;margin:0;}
  #start-veil p{opacity:.7;margin:0;}
  #start-veil[hidden]{display:none;}
  #dock{position:fixed;left:0;right:0;bottom:0;height:48px;z-index:40;
    background:rgba(5,10,20,.7);backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:14px;padding:0 44px 0 12px;
    transition:transform .25s ease;overflow-x:auto;overflow-y:hidden;}
  #dock.collapsed{transform:translateY(calc(100% - 12px));}
  #dock .ctl{display:flex;align-items:center;gap:6px;flex:none;
    font-size:13px;font-weight:600;letter-spacing:.04em;
    font-variant-numeric:tabular-nums;}
  #dock label{opacity:.65;font-size:11px;text-transform:uppercase;}
  #dock button{background:none;border:1px solid rgba(201,214,232,.3);color:var(--text);
    border-radius:8px;height:32px;min-width:32px;padding:0 10px;cursor:pointer;
    font:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;}
  #dock button:hover{border-color:rgba(201,214,232,.7);}
  #dock button:focus-visible,#dock select:focus-visible,#dock input:focus-visible,
  #tide-rail:focus-visible{outline:2px solid var(--drift);outline-offset:2px;}
  #dock select{background:rgba(201,214,232,.08);color:var(--text);
    border:1px solid rgba(201,214,232,.3);border-radius:6px;height:28px;font:inherit;font-size:13px;}
  #dock input[type=range]{width:76px;accent-color:var(--drift);}
  #dock output{min-width:52px;opacity:.85;}
  #brush .swatch{display:inline-block;width:10px;height:10px;border-radius:50%;
    margin-right:6px;vertical-align:-1px;}
  #dock-toggle{position:fixed;right:6px;bottom:8px;z-index:41;width:32px;height:32px;
    background:rgba(5,10,20,.7);border:1px solid rgba(201,214,232,.3);
    border-radius:8px;color:var(--text);cursor:pointer;font-size:12px;}
  #radial{position:fixed;z-index:45;pointer-events:none;}
  #toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:46;
    pointer-events:none;background:rgba(5,10,20,.85);border:1px solid rgba(201,214,232,.25);
    border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;
    letter-spacing:.04em;opacity:0;transition:opacity .3s ease;}
  #toast.show{opacity:1;}
  #tide-rail{position:fixed;right:8px;top:15%;bottom:25%;width:24px;z-index:40;
    border-radius:12px;background:rgba(201,214,232,.08);cursor:ns-resize;
    touch-action:none;}
  #tide-rail .fill{position:absolute;left:3px;right:3px;bottom:3px;border-radius:9px;
    background:linear-gradient(to top,var(--drift),rgba(63,191,176,.35));
    pointer-events:none;}
</style>
</head>
<body>
<canvas id="water"></canvas>

<div id="start-veil" role="button" tabindex="0" aria-label="Start Tide Garden">
  <h1>Tide Garden</h1>
  <p>tap anywhere to begin</p>
</div>

<nav id="dock" aria-label="Garden controls">
  <span class="ctl"><button id="play" aria-label="Pause" aria-pressed="true">&#10074;&#10074;</button></span>
  <span class="ctl"><button id="brush" aria-label="Seed voice: bloom"><span class="swatch" style="background:var(--bloom)"></span>bloom</button></span>
  <span class="ctl"><label for="root">root</label>
    <select id="root" aria-label="Root note"></select></span>
  <span class="ctl"><label for="mode">mode</label>
    <select id="mode" aria-label="Scale mode"></select></span>
  <span class="ctl"><label for="tempo">tempo</label>
    <input id="tempo" type="range" min="60" max="140" step="1" value="100"
      data-fmt="bpm" aria-label="Tempo"><output for="tempo"></output></span>
  <span class="ctl"><label for="swing">swing</label>
    <input id="swing" type="range" min="0" max="60" step="1" value="0"
      data-fmt="%" aria-label="Swing"><output for="swing"></output></span>
  <span class="ctl"><label for="mutation">mutate</label>
    <input id="mutation" type="range" min="0" max="100" step="1" value="0"
      data-fmt="%" aria-label="Mutation amount"><output for="mutation"></output></span>
  <span class="ctl"><button id="share" aria-label="Copy share link">share</button></span>
</nav>
<button id="dock-toggle" aria-label="Collapse controls" aria-expanded="true">&#9662;</button>

<div id="radial" hidden></div>
<div id="toast" aria-live="polite"></div>
<div id="tide-rail" role="slider" tabindex="0" aria-label="Tide level"
  aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-orientation="vertical">
  <div class="fill"></div>
</div>

<script src="tidegarden.js"></script>
</body>
</html>
