<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tide Garden</title>
<style>
  :root{
    --bg:#0B1626; --bg-low:#050A14; --bg-high:#12253D;
    --bloom:#FF8A6B; --drift:#3FBFB0; --pulse:#E8C97A; --text:#C9D6E8;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font:14px/1.4 system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;}
  #water{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #start-veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:rgba(5,10,20,.85);z-index:50;cursor:pointer;}
  #start-veil h1{font-weight:300;letter-spacing:.3em;text-transform:uppercase;font-size:20px;margin:0;}
  #start-veil p{opacity:.7;margin:0;}
  #start-veil[hidden]{display:none;}
  #dock{position:fixed;left:0;right:0;bottom:0;height:48px;z-index:40;
    background:rgba(5,10,20,.7);backdrop-filter:blur(8px);}
  #radial{position:fixed;z-index:45;pointer-events:none;}
  #toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:46;
    pointer-events:none;}
  #tide-rail{position:fixed;right:8px;top:15%;bottom:25%;width:24px;z-index:40;}
</style>
</head>
<body>
<canvas id="water"></canvas>

<div id="start-veil" role="button" tabindex="0" aria-label="Start Tide Garden">
  <h1>Tide Garden</h1>
  <p>tap anywhere to begin</p>
</div>

<!--
  Dock is intentionally empty: Pixel owns its contents (build round 6).
  Agreed child control ids:
    #play #brush #root #mode #tempo #swing #mutation #share
-->
<nav id="dock" aria-label="Garden controls"></nav>

<div id="radial" hidden></div>
<div id="toast" aria-live="polite"></div>
<div id="tide-rail" hidden></div>

<script src="tidegarden.js"></script>
</body>
</html>
